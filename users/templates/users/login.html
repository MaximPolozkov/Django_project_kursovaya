{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Вход</h1>
                {% if next and not user.is_authenticated %}
                    <div class="alert alert-info py-2">Чтобы открыть эту страницу, войдите в аккаунт.</div>
                {% endif %}
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <div class="d-flex justify-content-between mt-3">
                    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
                    <a href="{% url 'users:register' %}">Регистрация</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
