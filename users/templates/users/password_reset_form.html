{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-2">Восстановление пароля</h1>
                <p class="text-muted small mb-4">Укажите email, с которым вы регистрировались. Мы пришлём ссылку для смены пароля.</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
                </form>
                <p class="text-center mt-3 mb-0"><a href="{% url 'users:login' %}">← Ко входу</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
