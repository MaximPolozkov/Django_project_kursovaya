<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Рассылки{% endblock %} — MailFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; }
        .stat-number { font-size: 2.5rem; font-weight: 700; line-height: 1; }
        .checkbox-list { max-height: 260px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: .375rem; padding: .5rem .75rem; background: #fff; }
        .checkbox-list label { display: block; margin-bottom: .25rem; }
        .checkbox-list input { margin-right: .5rem; }
    </style>
</head>
<body class="bg-light">

{% include "includes/menu.html" %}

<main class="container py-4">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
        </div>
    {% endfor %}

    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-white-50 py-3 mt-auto">
    <div class="container d-flex justify-content-between">
        <span>© {% now "Y" %} MailFlow</span>
        <span>Сервис управления рассылками</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
