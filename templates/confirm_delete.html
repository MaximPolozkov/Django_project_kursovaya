{% extends "base.html" %}

{% block title %}Удаление{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4">Удалить {{ object_label }} «{{ object }}»?</h1>
                {% if delete_warning %}<p class="text-danger">{{ delete_warning }}</p>{% endif %}
                <p class="text-muted">Это действие нельзя отменить.</p>
                <form method="post" class="d-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Удалить</button>
                    <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
